[package]
name = "tractor-beam-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "tractor-beam"
path = "src/main.rs"

[dependencies]
arboard = "3"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
tractor-beam-core = { path = "../bridge-core" }
tractor-beam-application = { path = "../bridge-application" }
# Runtime inspection is opt-in through EGUI_INSPECTION and stays off in normal builds/runs.
eframe = { version = "0.35.0", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "inspection",
    "wayland",
    "x11",
] }
rust-i18n = "4.1.0"
open = { version = "5.3.5", features = ["shellexecute-on-windows"] }
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1.44"

[dev-dependencies]
serde_yaml_ng = "0.10.0"

[package.metadata.i18n]
available-locales = ["zh_CN", "en_US"]
default-locale = "zh_CN"
load-path = "locales"
