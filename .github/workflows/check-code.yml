name: Check Code

on:
  pull_request:
    branches: [main, codex/flutter-client]
  push:
    branches: [main, codex/flutter-client]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-code-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TRACTOR_BEAM_GIT_HASH: ${{ github.sha }}
  LLVM_MINGW_VERSION: "20250319"
  LLVM_MINGW_SHA256: "ab2a1489416fa82b3e85e88cb877053ee8a591993408caf076737d8de5ae72ca"

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check public IP literals
        run: python scripts/check_no_public_ip_literals.py

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
          targets: i686-pc-windows-gnullvm
      - uses: Swatinem/rust-cache@v2.9.1

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: Install llvm-mingw
        run: |
          set -euo pipefail
          archive="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-20.04-x86_64.tar.xz"
          curl --fail --location --retry 3 \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          echo "${LLVM_MINGW_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar -xJf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/${archive%.tar.xz}/bin" >>"${GITHUB_PATH}"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check locked workspace
        run: cargo check --locked --workspace

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Build Bridge GUI
        run: cargo build --locked --release -p tractor-beam-gui

      - name: Build Native Hook for Linux Client
        run: cargo build --locked --release -p tractor-beam-native-hook --target i686-pc-windows-gnullvm

      - name: Verify Linux Native Hook proxy
        run: python3 scripts/verify_winmm_proxy.py target/i686-pc-windows-gnullvm/release/tractor_beam_native_hook.dll

      - name: Build Relay Server
        run: cargo build --locked --release -p tractor-beam-relay

  windows:
    name: Windows targets
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2.9.1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable

      - name: Verify Flutter asset checkout
        shell: pwsh
        run: |
          $font = "apps/tractor-beam-flutter/assets/fonts/Xiaolai-Regular.ttf"
          if ((Get-Item -LiteralPath $font).Length -lt 1000000) {
            throw "Flutter font is missing or is still a Git LFS pointer"
          }

      - name: Verify generated Flutter bridge
        shell: pwsh
        run: |
          dart pub global activate flutter_rust_bridge_codegen 2.13.0
          $env:PATH += ";$env:LOCALAPPDATA\Pub\Cache\bin"
          ./scripts/generate_flutter_bridge.ps1
          git diff --exit-code -- `
            crates/flutter-bridge/src/frb_generated.rs `
            apps/tractor-beam-flutter/lib/bridge/generated `
            apps/tractor-beam-flutter/windows/runner/frb_generated.h

      - name: Build Bridge GUI
        run: cargo build --locked --release -p tractor-beam-gui --target x86_64-pc-windows-msvc

      - name: Build Injector
        run: cargo build --locked --release -p tractor-beam-isaac-injector --target i686-pc-windows-msvc

      - name: Build Native Hook
        run: cargo build --locked --release -p tractor-beam-native-hook --target i686-pc-windows-msvc

      - name: Check Flutter client
        working-directory: apps/tractor-beam-flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build Flutter client
        working-directory: apps/tractor-beam-flutter
        run: flutter build windows --release --build-name 0.5.2 --build-number 1
