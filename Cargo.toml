[workspace]
members = [
    "crates/bridge-application",
    "crates/flutter-bridge",
    "crates/bridge-core",
    "crates/bridge-relay",
    "crates/bridge-gui",
    "crates/isaac-injector",
    "crates/native-hook",
    "crates/hook-ipc",
    "crates/relay-protocol",
    "crates/direct-protocol",
]
resolver = "3"

[workspace.package]
version = "0.5.2" # x-release-please-version
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/tianguantg/TractorBeam"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

